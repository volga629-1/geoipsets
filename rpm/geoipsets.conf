[general]
# Directory below which geoipsets creates the geoipsets/ provider tree.
# The packaged systemd service grants write access to /var/lib/geoipsets.
output-dir=/var/lib

# Supported providers: dbip, maxmind
# MaxMind requires account credentials in the [maxmind] section.
provider=dbip

# Supported firewalls: iptables, nftables
firewall=nftables

# Supported address families: ipv4, ipv6
address-family=ipv4,ipv6

# Uncomment country codes to generate only selected countries. If this section
# is empty, sets are generated for all countries available from the provider.
[countries]
#RU
#CN

#[maxmind]
#account-id=
#license-key=
